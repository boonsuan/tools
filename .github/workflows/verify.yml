name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: run_all.py (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run every check
        working-directory: verification
        run: python run_all.py

  residue-maps:
    name: residue maps reproduce from the search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Rerun the search and rebuild the archive
        working-directory: verification
        run: |
          g++ -O2 -o residue_search discovery/find_residue_witnesses.cpp
          ./residue_search > search_output.txt
          python discovery/archive_residue_witnesses.py search_output.txt --output /tmp/residue_witnesses.json
          cmp /tmp/residue_witnesses.json data/residue_witnesses.json

  research:
    name: research results reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: "B(n,r,t): check the stored data and the classification"
        working-directory: research/b_n_r_t
        run: python classify.py
      - name: "B(n,r,t): rebuild both programs and rerun every stored case with t <= 4"
        working-directory: research/b_n_r_t
        run: |
          gcc -O3 -march=native -fopenmp -Wall -Werror -o endgame endgame.c
          gcc -O3 -march=native -fopenmp -Wall -Werror -o complete_search complete_search.c
          python reproduce.py --check
      - name: "K6 v complement(K4): verify the certificates exactly"
        working-directory: research/k6_join_4
        run: python verify_k6_join_4.py
